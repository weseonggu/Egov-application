version: '3.8'

services:
  oracle-db:
    # Oracle XE 21c (무료, 경량 버전)
    # 다른 버전 옵션:
    #   - gvenzl/oracle-xe:18-slim (18c XE)
    #   - gvenzl/oracle-free:23-slim (23c Free, 최신)
    #   - container-registry.oracle.com/database/enterprise:19.3.0.0 (19c, 라이선스 필요)
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-21c-xe

    ports:
      - "1521:1521"   # Oracle Listener
      - "5500:5500"   # Oracle Enterprise Manager (EM Express)

    environment:
      # SYS, SYSTEM 사용자 비밀번호
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}

      # 애플리케이션용 사용자 (선택)
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    volumes:
      # 데이터 영속화
      - oracle_data:/opt/oracle/oradata

      # 초기화 스크립트 (컨테이너 최초 실행 시)
      # - ./init-scripts:/container-entrypoint-initdb.d

    # 헬스체크
    # healthcheck:
    #   test: ["CMD", "healthcheck.sh"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 300s

    # 리소스 제한 (필요시 조정)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    restart: unless-stopped

volumes:
  oracle_data:
    driver: local
