# ============================================
# \uC11C\uBC84 \uC124\uC815
# ============================================
server.port=${APP_PORT:8080}

# \uC218\uB3D9 Bean\uC774 \uC790\uB3D9 Bean\uC744 \uC624\uBC84\uB77C\uC774\uB529\uD558\uAC8C \uC124\uC815
spring.main.allow-bean-definition-overriding=true

# open-in-view(\uD639\uC740 Open-Session-In-View(OSIV))
# true(\uAE30\uBCF8\uAC12) : \uC0AC\uC6A9\uC790\uC5D0\uAC8C \uC751\uB2F5 \uB610\uB294 view\uAC00 \uB80C\uB354\uB9C1\uB420 \uB54C\uAE4C\uC9C0 \uC601\uC18D\uC131 \uCEE8\uD14D\uC2A4\uD2B8 \uC720\uC9C0
# false : \uD2B8\uB79C\uC7AD\uC158\uC774 \uC885\uB8CC\uB420 \uB54C \uC601\uC18D\uC131 \uCEE8\uD14D\uC2A4\uD2B8 \uC885\uB8CC
spring.jpa.open-in-view=false

# ============================================
# Oracle Database \uC124\uC815 (.env \uD30C\uC77C\uC5D0\uC11C \uB85C\uB4DC)
# ============================================
spring.basic.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.basic.datasource.url=${DB_URL}
spring.basic.datasource.username=${DB_USERNAME}
spring.basic.datasource.password=${DB_PASSWORD}

# Second DataSource ??
spring.second.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.second.datasource.url=${DB_URL}
spring.second.datasource.username=${DB_USERNAME}
spring.second.datasource.password=${DB_PASSWORD}

# ============================================
# MyBatis \uC124\uC815
# ============================================
mybatis.mapper-locations=classpath:egovframework/sqlmap/mappers/**/*.xml
mybatis.config-location=classpath:egovframework/sqlmap/mybatis-config.xml
mybatis.type-aliases-package=egovframework.example

# ============================================
# Swagger / OpenAPI \uC124\uC815
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# Actuator \uC124\uC815
# ============================================
management.endpoints.web.exposure.include=health,info,metrics

# SQL \uCD08\uAE30\uD654 \uC124\uC815
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema-member.sql
spring.sql.init.platform=oracle