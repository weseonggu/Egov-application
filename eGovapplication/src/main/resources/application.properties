# ============================================
# \uC11C\uBC84 \uC124\uC815
# ============================================
server.port=${APP_PORT:8080}

# \uC218\uB3D9 Bean\uC774 \uC790\uB3D9 Bean\uC744 \uC624\uBC84\uB77C\uC774\uB529\uD558\uAC8C \uC124\uC815
spring.main.allow-bean-definition-overriding=true

# open-in-view(혹은 Open-Session-In-View(OSIV))
# true(기본값) : 사용자에게 응답 또는 view가 렌더링될 때까지 영속성 컨텍스트 유지
# false : 트랜잭션이 종료될 때 영속성 컨텍스트 종료
spring.jpa.open-in-view=false

# ============================================
# Oracle Database 설정 (.env 파일에서 로드)
# ============================================
# Basic DataSource
spring.basic.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.basic.datasource.url=${DB_URL}
spring.basic.datasource.username=${DB_USERNAME}
spring.basic.datasource.password=${DB_PASSWORD}

# Secondary DataSource
spring.secondary.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.secondary.datasource.url=${DB_SECONDARY_URL}
spring.secondary.datasource.username=${DB_SECONDARY_USERNAME}
spring.secondary.datasource.password=${DB_SECONDARY_PASSWORD}

# ============================================
# MyBatis 설정
# ============================================
mybatis.mapper-locations=classpath:egovframework/sqlmap/mappers/**/*.xml
mybatis.config-location=classpath:egovframework/sqlmap/mybatis-config.xml
mybatis.type-aliases-package=egovframework.example

# ============================================
# Swagger / OpenAPI \uC124\uC815
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================
# Actuator \uC124\uC815
# ============================================
management.endpoints.web.exposure.include=health,info,metrics

# SQL \uCD08\uAE30\uD654 \uC124\uC815
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema-member.sql
spring.sql.init.platform=oracle